<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Focus and hit testing checks</title>
<body><pre id="results">Running…</pre><script type="module">
import { createPlayer } from "../dist/browser.js";
import { createDiagram } from "../dist/index.js";
const model = {
  version: 1, viewport: { width: 640, height: 320 },
  nodes: [
    { id: "client", kind: "rect", x: 40, y: 120, width: 120, height: 80 },
    { id: "service", kind: "rect", x: 460, y: 120, width: 120, height: 80 },
    { id: "focus", kind: "group", x: 220, y: 40, width: 180, height: 240 },
    { id: "child", kind: "ellipse", parentId: "focus", x: 30, y: 80, width: 120, height: 80 },
    { id: "hidden", kind: "rect", visible: false, x: 20, y: 20, width: 80, height: 50 }
  ],
  edges: [{ id: "request", from: "client", to: "service" }],
  scenes: [{ id: "focus", label: "Focus", beats: [
    { durationMs: 1000, transitionMs: 200, actions: [{ type: "focus", target: "focus" }] },
    { durationMs: 1000, transitionMs: 200, actions: [{ type: "focus", target: null }] }
  ] }]
};
const results = [];
function assert(condition, message) { if (!condition) throw new Error(message); }
const host = document.createElement("div"); host.style.width = "640px"; host.style.height = "320px"; document.body.append(host);
const player = createPlayer(host, model, { controls: false });
try {
  const core = createDiagram(model); player.seek(1000);
  assert(host.querySelector("svg").getAttribute("viewBox") === core.renderSvg(1000).match(/viewBox="([^"]+)/)[1], "player and export cameras match");
  const hover = []; const clicks = [];
  host.addEventListener("hover", (event) => hover.push(event.detail)); host.addEventListener("click", (event) => clicks.push(event.detail));
  const svg = host.querySelector("svg"); const rect = svg.getBoundingClientRect(); const view = player.getState().frame.camera;
  const clientX = rect.left + ((230 - view.x) / view.width) * rect.width; const clientY = rect.top + ((60 - view.y) / view.height) * rect.height;
  svg.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX, clientY }));
  svg.dispatchEvent(new MouseEvent("click", { bubbles: true, clientX, clientY }));
  assert(hover.at(-1)?.type === "node" && hover.at(-1)?.id === "focus", "hover identifies visible focused group");
  assert(clicks.at(-1)?.type === "node" && clicks.at(-1)?.id === "focus", "click identifies visible focused group");
  assert(core.hitTest(0, { x: 40, y: 40 }) === null, "hidden object is excluded from hit testing");
  results.push({ name: "focus camera and pointer mapping", passed: true });
} catch (error) { results.push({ name: "focus camera and pointer mapping", passed: false, error: error.message }); }
finally { player.destroy(); host.remove(); }
window.browserFocusResults = results; document.querySelector("#results").textContent = JSON.stringify(results, null, 2);
</script></body></html>
