<!doctype html>
<meta charset="utf-8">
<title>flowsvg Web Component checks</title>
<script type="module">
  import { defineFlowPlayer, FLOW_PLAYER_TAG } from "../dist/web-component.js";

  const results = [];
  const record = (name, passed, detail = "") => results.push({ name, passed, detail });
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const makeDocument = (id, theme = "light", timeline = false) => ({
    version: 1,
    title: id,
    theme,
    viewport: { width: 320, height: 180 },
    nodes: [{ id, kind: "rect", x: 30, y: 50, width: 120, height: 60, label: id }],
    edges: [],
    scenes: timeline ? [{ id: "scene", label: "Scene", beats: [{ durationMs: 100, actions: [] }] }] : []
  });

  record("module does not auto-register", customElements.get(FLOW_PLAYER_TAG) === undefined);
  const first = defineFlowPlayer();
  const second = defineFlowPlayer();
  record("explicit registration is idempotent", first === second && customElements.get(FLOW_PLAYER_TAG) === first);

  const element = document.createElement(FLOW_PLAYER_TAG);
  element.controls = false;
  element.speed = 1.5;
  element.theme = "dark";
  element.document = makeDocument("object-document", "light");
  const eventTypes = [];
  element.addEventListener("timeupdate", () => eventTypes.push("timeupdate"));
  document.body.append(element);
  await wait(0);
  record("object document mounts", element.querySelector(".flowsvg-canvas") !== null && element.getState()?.frame.nodes[0]?.id === "object-document");
  record("properties configure player", element.getState()?.speed === 1.5 && element.querySelector(".flowsvg-controls") === null && element.getState()?.frame.nodes[0]?.style?.fill === "#1d2939", JSON.stringify({ speed: element.getState()?.speed, controls: element.querySelector(".flowsvg-controls") !== null, fill: element.getState()?.frame.nodes[0]?.style?.fill }));
  element.setAttribute("document", JSON.stringify(makeDocument("json-document")));
  await wait(0);
  record("JSON document attribute mounts", element.getState()?.frame.nodes[0]?.id === "json-document");

  const originalFetch = window.fetch;
  window.fetch = (input, init) => new Promise((resolve, reject) => {
    const url = String(input);
    const signal = init?.signal;
    const timer = setTimeout(() => resolve(new Response(JSON.stringify(urlForDocument(url)), { headers: { "content-type": "application/json" } })), url.endsWith("first.json") ? 40 : 0);
    signal?.addEventListener("abort", () => { clearTimeout(timer); reject(new DOMException("Aborted", "AbortError")); });
  });
  const urlForDocument = (url) => url.endsWith("first.json") ? makeDocument("first-document") : makeDocument("second-document");
  element.src = "first.json";
  element.src = "second.json";
  await wait(70);
  record("stale URL response cannot replace latest document", element.getState()?.frame.nodes[0]?.id === "second-document");
  window.fetch = originalFetch;

  element.document = makeDocument("event-document", "light", true);
  await wait(0);
  const forwarded = [];
  element.addEventListener("playstatechange", () => forwarded.push("playstatechange"));
  element.play();
  await wait(20);
  element.pause();
  record("player events forward from element", forwarded.length >= 2);

  element.remove();
  record("disconnect cleans rendered player", element.querySelector(".flowsvg-canvas") === null && element.getState() === undefined);
  window.browserWebComponentResults = results;
</script>
