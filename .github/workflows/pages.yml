name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - apps/native-example/index.html
      - apps/native-example/package.json
      - apps/native-example/src/**
      - apps/native-example/tsconfig.json
      - apps/native-example/vite.config.js
      - packages/flowsvg/docs/images/basic-shapes.gif
      - packages/flowsvg/docs/images/request-response.gif
      - packages/flowsvg/docs/images/web-service-deployment.gif
      - packages/flowsvg/docs/images/llm-inference.gif
      - packages/flowsvg/package.json
      - packages/flowsvg/scripts/**
      - packages/flowsvg/src/**
      - packages/flowsvg/tsconfig*.json
      - packages/showcase/package.json
      - packages/showcase/scripts/**
      - packages/showcase/src/**
      - packages/showcase/tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.showcase.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the formal Native showcase
        run: pnpm --filter flowsvg-native-example build
        env:
          SHOWCASE_SOURCE: dist/formal.js
          SHOWCASE_BASE: /${{ github.event.repository.name }}/
      - name: Copy public README animations
        run: |
          mkdir -p apps/native-example/dist/previews
          cp packages/flowsvg/docs/images/{basic-shapes,request-response,web-service-deployment,llm-inference}.gif apps/native-example/dist/previews/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/native-example/dist

  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
